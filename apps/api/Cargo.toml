[package]
name = "aniki-api"
description = "Aniki backend API — auth, RAG, STT JWT minting, LLM proxy"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "aniki-api"
path = "src/main.rs"

[dependencies]
aniki-domain = { path = "../../crates/domain" }
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "bigdecimal"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
jsonwebtoken = "9"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
rand = "0.8"
dotenvy = "0.15"
futures = "0.3"
async-stream = "0.3"
# Pinned: pgvector 0.4.2 widened its sqlx range to ">=0.8, <0.10", which lets Cargo
# resolve sqlx 0.9 for pgvector while this crate stays on 0.8. Two sqlx-core copies
# means `Vector` no longer satisfies our `sqlx::Type`. 0.4.1 requires "^0.8".
pgvector = { version = "=0.4.1", features = ["sqlx"] }
