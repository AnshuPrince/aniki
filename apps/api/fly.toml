app = "aniki-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  ANIKI_ENV = "production"
  PORT = "8080"
  RUST_LOG = "aniki_api=info,tower_http=info"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
