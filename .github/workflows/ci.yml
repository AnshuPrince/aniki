name: CI

on:
  pull_request:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - ".cursor/**"
      - "**/*.md"
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - ".cursor/**"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aniki
          POSTGRES_PASSWORD: aniki
          POSTGRES_DB: aniki
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://aniki:aniki@localhost:5432/aniki
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret
      # Overlay compile is local macOS only (scripts/ci-local.sh --desktop).
      CARGO_LINUX_EXCLUDES: --exclude aniki-desktop --exclude aniki-audio-core
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run migrations
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=aniki psql -v ON_ERROR_STOP=1 -h localhost -U aniki -d aniki -f apps/api/migrations/001_init.sql
          PGPASSWORD=aniki psql -v ON_ERROR_STOP=1 -h localhost -U aniki -d aniki -f apps/api/migrations/002_indexes.sql
          PGPASSWORD=aniki psql -v ON_ERROR_STOP=1 -h localhost -U aniki -d aniki -f apps/api/migrations/003_google_sub.sql

      - name: cargo check
        run: cargo check --workspace --all-targets ${{ env.CARGO_LINUX_EXCLUDES }}

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets ${{ env.CARGO_LINUX_EXCLUDES }} -- -D warnings

      - name: cargo test
        run: cargo test --workspace ${{ env.CARGO_LINUX_EXCLUDES }}

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build web
        run: pnpm --filter @aniki/web build
