services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aniki
      POSTGRES_PASSWORD: aniki
      POSTGRES_DB: aniki
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aniki -d aniki"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: aniki
      PGPASSWORD: aniki
      PGDATABASE: aniki
    restart: "no"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://aniki:aniki@postgres:5432/aniki
      REDIS_URL: redis://redis:6379
      RUST_LOG: aniki_api=debug,tower_http=debug
      JWT_SECRET: dev-jwt-secret-change-in-production
      SPEECHMATICS_API_KEY: ${SPEECHMATICS_API_KEY:-}
      APP_URL: http://localhost:3000
      API_URL: http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    profiles:
      - full

volumes:
  postgres_data:
